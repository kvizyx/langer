[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
langer-mediapipe = { path = "crates/langer-mediapipe", version = "0.1.0" }

anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
axum = { version = "0.8.9", default-features = false }
clap = { version = "4.6.7", default-features = false }
divan = { version = "0.1.21", default-features = false }
flatbuffers = { version = "25.12.19", default-features = false }
flexbuffers = { version = "25.12.19", default-features = false }
http-body-util = { version = "0.1.5", default-features = false }
insta = { version = "1.49.0", default-features = false, features = ["json"] }
lingua = { version = "1.8.0", default-features = false }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rstest = { version = "0.28.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
strength_reduce = { version = "0.2.4", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std"] }
utoipa = { version = "6.0.0", default-features = false }
utoipa-axum = { version = "0.3.0", default-features = false }
utoipa-scalar = { version = "0.4.0", default-features = false }
zip = { version = "9.0.5", default-features = false }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
expect_used = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
map_err_ignore = "warn"
panic = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"

# Internal crates are never published, so crates.io metadata is not needed.
cargo_common_metadata = "allow"
# Transitive duplicates (e.g. several `hashbrown` versions) are outside our control.
multiple_crate_versions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
# Unwinding lets a panic, should one happen, end as a 500 response instead of stopping the service.
panic = "unwind"
strip = true

[profile.bench]
debug = 1
