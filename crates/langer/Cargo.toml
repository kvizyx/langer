[package]
name = "langer"
description = "HTTP service for language detection (fastText and Lingua)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "json", "tokio"] }
clap = { workspace = true, features = ["derive", "env", "error-context", "help", "std", "usage"] }
langer_mediapipe.workspace = true
# All languages, like the Python service it replaces (`from_all_languages()`).
lingua = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt"] }
utoipa = { workspace = true, features = ["macros"] }
utoipa-axum.workspace = true
utoipa-scalar = { workspace = true, features = ["axum"] }

[dev-dependencies]
http-body-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
